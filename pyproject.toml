[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnpolicy"
version = "1.0.0"
description = "Predictive churn model with cross-validated evaluation and a capacity-constrained prescriptive retention policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
churnpolicy = "churnpolicy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churnpolicy = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
